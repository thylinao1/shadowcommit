services:
  launchpad:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_IMAGE: ${CONTAINER_RUNTIME_BASE_IMAGE:-node:22-bookworm-slim}
        DEBIAN_MIRROR: ${CONTAINER_APT_MIRROR:-}
        DEBIAN_SECURITY_MIRROR: ${CONTAINER_APT_SECURITY_MIRROR:-}
    image: volc-agent-launchpad:local
    restart: unless-stopped
    env_file:
      # Optional, so a fresh clone can start with the credentials in the shell instead of a
      # file. Required, this line alone made `docker compose config` fail on a clean checkout
      # with `.env not found`, before anything about the project was even parsed.
      - path: ${LAUNCHPAD_ENV_FILE:-.env}
        required: false
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      APP_DATA_DIR: /app/data
      AGENT_WORKSPACE_ROOT: /app/workspaces
      CODEX_HOME: /app/codex-home
      CODEX_SANDBOX_MODE: ${CODEX_SANDBOX_MODE:-workspace-write}
      # Deliberately NOT set to container here, and this file cannot run that way today.
      # A turn runs in its own container, so the control plane needs a container daemon to start
      # one. Under compose the only daemon is the host's, reachable only by mounting its socket,
      # and container-socket-guard.ts refuses that repo-wide because it is host root in practice.
      # So this file has no container-mode configuration, and an operator who runs it must accept
      # the unconfined runtime explicitly, which every turn then journals as confinement:"none".
      # The supported container path is `npm run poc` on the host. Tracked as an open question
      # for the security lane: DinD sidecar, a rootless daemon, or drop the compose path.
      SHADOW_ALLOW_UNCONFINED: ${SHADOW_ALLOW_UNCONFINED:-0}
    ports:
      - "${PUBLIC_PORT:-3000}:3000"
    volumes:
      - ./data:/app/data
      - ./workspaces:/app/workspaces
      - ./codex-home:/app/codex-home
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    mem_limit: 4g
    cpus: 2
